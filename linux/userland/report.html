<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Audit History Viewer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #000;
    color: #eee;
  }
  h1 {
    margin-bottom: 15px;
    color: #55f0f5;
  }
  #status {
    margin-bottom: 15px;
    color: #55f0f5;
  }

  .group {
    margin-bottom: 10px;
    border-left: 2px solid #55f0f5;
    padding-left: 10px;
  }

  .group-title {
    cursor: pointer;
    font-weight: bold;
    color: #55f0f5;
    padding: 6px 0;
  }

  .group-content {
    display: none;
    margin-left: 15px;
  }

  .summary-row {
    display: grid;
    grid-template-columns: 160px 200px 1fr 420px;
    padding: 6px;
    cursor: pointer;
    font-weight: bold;
    background: #111;
    margin: 2px 0;
    border: 1px solid #333;
    border-radius: 4px;
  }
  .summary-row:hover {
    background: #222;
  }

  .summary-row div {
    padding-right: 10px;
    word-break: break-all;
  }

  .details {
    display: none;
    background: #0d0d0d;
    padding: 10px 20px;
    font-size: 0.9em;
    border-top: 1px solid #333;
    border-radius: 0 0 4px 4px;
  }

  .detail-item {
    margin-bottom: 6px;
  }

  .detail-label {
    color: #55f0f5;
    font-weight: bold;
    display: inline-block;
    min-width: 120px;
  }

  .ok-entry .summary-row {
    background: #0a0a0a;
    color: #777;
    font-style: italic;
  }
  .ok-entry .summary-row:hover {
    background: #1a1a1a;
  }
</style>
</head>
<body>

<h1>Audit History Viewer</h1>
<div id="status">Loading audit logs...</div>
<div id="audit-list"></div>

<script>
const baseUrl = 'http://localhost:1025';

async function listJsonFiles() {
  const response = await fetch(baseUrl + '/');
  const html = await response.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const links = Array.from(doc.querySelectorAll('a'));
  const jsonFiles = links
    .map(a => a.getAttribute('href'))
    .filter(href => href && /^auditron-report-\d{8}T\d{6}Z\.json$/.test(href));
  return jsonFiles;
}

function parseFileTimestamp(filename) {
  const match = filename.match(/auditron-report-(\d{8}T\d{6})Z\.json/);
  if (!match) return null;
  const ts = match[1];
  const year = ts.substring(0,4);
  const month = ts.substring(4,6);
  const day = ts.substring(6,8);
  const hour = ts.substring(9,11);
  const min = ts.substring(11,13);
  const sec = ts.substring(13,15);
  return new Date(`${year}-${month}-${day}T${hour}:${min}:${sec}Z`);
}

async function loadAllJson() {
  const status = document.getElementById('status');
  let files = [];

  try {
    files = await listJsonFiles();
    if (files.length === 0) {
      status.textContent = 'No auditron report JSON files found.';
      return;
    }
  } catch (err) {
    status.textContent = 'Failed to list directory: ' + err.message;
    return;
  }

  const allEntries = [];
  const promises = files.map(async file => {
    try {
      const resp = await fetch(`${baseUrl}/${file}`);
      const data = await resp.json();
      allEntries.push({ filename: file, data });
    } catch (err) {
      console.error('Failed to load', file, err);
    }
  });

  await Promise.all(promises);
  allEntries.sort((a, b) => b.filename.localeCompare(a.filename));
  status.textContent = `Loaded ${allEntries.length} report(s).`;
  displayAuditEntries(allEntries);
}

function displayAuditEntries(entries) {
  const container = document.getElementById('audit-list');
  container.innerHTML = '';

  const grouped = {};
  for (const { filename, data } of entries) {
    const dateObj = parseFileTimestamp(filename);
    if (!dateObj) continue;

    const dateStr = dateObj.toLocaleDateString();
    const timeStr = dateObj.toLocaleTimeString();

    if (!grouped[dateStr]) grouped[dateStr] = {};
    if (!grouped[dateStr][timeStr]) grouped[dateStr][timeStr] = {};

    for (const check of (data.checks || [])) {
      const id = check.id || '—';
      if (!grouped[dateStr][timeStr][id]) grouped[dateStr][timeStr][id] = [];
      grouped[dateStr][timeStr][id].push(check);
    }
  }

  Object.keys(grouped).forEach(dateStr => {
    const dateGroup = document.createElement('div');
    dateGroup.className = 'group';

    const dateTitle = document.createElement('div');
    dateTitle.className = 'group-title';
    dateTitle.textContent = `📅 ${dateStr}`;
    const dateContent = document.createElement('div');
    dateContent.className = 'group-content';

    dateTitle.addEventListener('click', () => {
      dateContent.style.display = dateContent.style.display === 'block' ? 'none' : 'block';
    });

    Object.keys(grouped[dateStr]).forEach(timeStr => {
      const timeGroup = document.createElement('div');
      timeGroup.className = 'group';

      const timeTitle = document.createElement('div');
      timeTitle.className = 'group-title';
      timeTitle.textContent = `⏰ ${timeStr}`;
      const timeContent = document.createElement('div');
      timeContent.className = 'group-content';

      timeTitle.addEventListener('click', () => {
        timeContent.style.display = timeContent.style.display === 'block' ? 'none' : 'block';
      });

      Object.keys(grouped[dateStr][timeStr]).forEach(id => {
        const idGroup = document.createElement('div');
        idGroup.className = 'group';

        const idTitle = document.createElement('div');
        idTitle.className = 'group-title';
        idTitle.textContent = `🆔 ${id}`;
        const idContent = document.createElement('div');
        idContent.className = 'group-content';

        idTitle.addEventListener('click', () => {
          idContent.style.display = idContent.style.display === 'block' ? 'none' : 'block';
        });

        grouped[dateStr][timeStr][id].forEach(check => {
          const entryWrapper = document.createElement('div');
          entryWrapper.className = 'entry';
          if (check.status === 'OK') entryWrapper.classList.add('ok-entry');

          const summary = document.createElement('div');
          summary.className = 'summary-row';

          const timeCol = document.createElement('div');
          timeCol.textContent = dateStr;
          const idCol = document.createElement('div');
          idCol.textContent = check.id || '—';
          const pathCol = document.createElement('div');
          pathCol.textContent = check.path || '—';
          const shaCol = document.createElement('div');
          shaCol.textContent = check.sha256 || '—';

          summary.appendChild(timeCol);
          summary.appendChild(idCol);
          summary.appendChild(pathCol);
          summary.appendChild(shaCol);

          const details = document.createElement('div');
          details.className = 'details';

          Object.keys(check).forEach(key => {
            if (key === 'started') return; // skip internal
            const item = document.createElement('div');
            item.className = 'detail-item';
            item.innerHTML = `<span class="detail-label">${key}:</span> ${check[key]}`;
            details.appendChild(item);
          });

          summary.addEventListener('click', () => {
            details.style.display = details.style.display === 'block' ? 'none' : 'block';
          });

          entryWrapper.appendChild(summary);
          entryWrapper.appendChild(details);
          idContent.appendChild(entryWrapper);
        });

        idGroup.appendChild(idTitle);
        idGroup.appendChild(idContent);
        timeContent.appendChild(idGroup);
      });

      timeGroup.appendChild(timeTitle);
      timeGroup.appendChild(timeContent);
      dateContent.appendChild(timeGroup);
    });

    dateGroup.appendChild(dateTitle);
    dateGroup.appendChild(dateContent);
    container.appendChild(dateGroup);
  });

  if (Object.keys(grouped).length === 0) {
    container.textContent = 'No audit entries found.';
  }
}

loadAllJson();
</script>

</body>
</html>
