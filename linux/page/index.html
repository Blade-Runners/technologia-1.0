<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUDITRON - Audit History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>

<body class="antialiased">

    <div class="main container mx-auto p-4 md:p-8 bg-black font-mono text-white min-h-screen">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-2">Welcome to AUDITRON</h1>
            <p class="text-lg text-gray-400">Your system's security at a glance.</p>
        </header>

        <h2 class="text-3xl font-semibold text-white mb-6">Audit History</h2>

        <div class="audit-history overflow-x-auto rounded-lg shadow-lg">
            <table class="w-full text-sm text-left">
                <thead class="text-xs uppercase">
                    <tr>
                        <th scope="col" class="p-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-shield-check" viewBox="0 0 16 16">
                                <path
                                    d="M5.338 1.59a61.44 61.44 0 0 0-2.837.856.481.481 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.725 10.725 0 0 0 2.287 2.233c.346.244.652.42.893.533.12.057.218.095.293.118a.55.55 0 0 0 .101.025.615.615 0 0 0 .1-.025c.076-.023.174-.06.294-.118.24-.113.547-.29.893-.533a10.726 10.726 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.95-1.09-2.235-2.542-4.688-3.43a1.5 1.5 0 0 0-.443-.135L8 0.5l-.338.09a61.44 61.44 0 0 0-2.324.699zM8 1.5a14.5 14.5 0 0 1 2.533.51 59.907 59.907 0 0 1 2.08.736.36.36 0 0 1 .245.294c.523 3.93-1.08 6.94-2.57 8.86a9.728 9.728 0 0 1-2.287 2.233c-.346.244-.652.42-.893.533-.12.057-.218.095-.293.118a.55.55 0 0 0-.101.025.615.615 0 0 0-.1-.025c-.076-.023-.174-.06-.294-.118-.24-.113-.547-.29-.893-.533a9.726 9.726 0 0 1-2.287-2.233C2.131 11.43 1.09 8.42.566 4.49a.36.36 0 0 1 .245-.294 59.903 59.903 0 0 1 2.08-.736A14.502 14.502 0 0 1 8 1.5z" />
                                <path
                                    d="M10.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0z" />
                            </svg>
                        </th>
                        <th scope="col" class="px-6 py-3">Rule ID</th>
                        <th scope="col" class="px-6 py-3">Description</th>
                        <th scope="col" class="px-6 py-3">Action</th>
                        <th scope="col" class="px-6 py-3">User</th>
                        <th scope="col" class="px-6 py-3">Timestamp</th>
                        <th scope="col" class="px-6 py-3">Status</th>
                    </tr>
                </thead>
                <tbody id="audit-history-body">
                    <!-- Dynamic content will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
